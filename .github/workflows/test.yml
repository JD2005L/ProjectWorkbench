name: test
on:
  # No branch allow-list. A reviewed head that produced no check run is how a
  # failing gate reached review unnoticed: pushes to any branch, and every pull
  # request, must produce a run.
  #
  # NOTE: this makes the workflow RUN. Whether a run is a *required* check is
  # branch-protection configuration outside this repository, and nothing here
  # should be read as claiming that enforcement.
  push:
  pull_request:
jobs:
  node-test:
    name: node-test (${{ matrix.deploy-mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deploy-mode: [host, container]
    env:
      PW_DEPLOY_MODE: ${{ matrix.deploy-mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the release guard in test/release-version.test.mjs has to ask what
          # changed: on a pull request, this branch relative to its base; on a push to the release
          # branch, the event's own `before` commit relative to HEAD. The default shallow checkout
          # has neither the base branch nor the pre-push commit, so the guard would skip — and a
          # check that skips in the one place it is meant to gate is not a check.
          #
          # The guard reads that event through GITHUB_EVENT_PATH (see test/release-guard-lib.mjs),
          # which the runner always provides, so nothing here has to forward the SHAs by hand.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run test suite
        working-directory: app
        run: npm test