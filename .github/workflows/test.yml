name: test
on:
  push:
    branches: [ main, goa-deploy ]
  pull_request:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Run test suite
        working-directory: app
        run: npm test