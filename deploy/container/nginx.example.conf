# Include inside the existing TLS server; preserve its certificate and access policy.
location = /deploy-service {
    return 308 /deploy-service/;
}

# API clients use the existing bearer-token protocol; no credentials in URLs.
location ^~ /deploy-service/v1/ {
    proxy_pass http://127.0.0.1:3800/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 48m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_buffering off;
}

location /deploy-service/ {
    proxy_pass http://127.0.0.1:3800;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
    proxy_buffering off;
}
