# Project Workbench tmux config (installed as /home/admin/.tmux.conf).
# Without `mouse on`, the wheel is forwarded to the running program, which
# usually maps it to Up/Down — so wheel-up in Claude/bash recalls the previous
# prompt instead of scrolling the pane's scrollback.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g status off
set -g escape-time 0
set -g focus-events on
setw -g aggressive-resize on
setw -g xterm-keys on

# Every browser tab that opens a project terminal is its own ttyd child running
# `tmux attach-session`, so it is its own tmux client with its own size. A window
# has exactly ONE size, and tmux's `latest` default re-picks it from whichever
# client last had activity — measured 7 resizes in 8 keystrokes with an 80x24 and a
# 160x48 client attached, which SIGWINCHes the pane, makes a full-screen TUI
# repaint continuously, and keeps redrawing the `·` padding tmux fills an oversized
# client's uncovered area with. `smallest` pads the larger client with a static
# margin and costs nobody any content; `largest` clips the smaller client to the
# top-left of the window instead, which is worse. tmux recomputes on attach and
# detach, so a client left alone returns to its own full size. Kept identical to
# the container's /etc/tmux.conf (Containerfile) — that is the file the root tmux
# server actually reads in container mode.
set -g window-size smallest

set -g set-clipboard on

# Disable right-click context menu — it conflicts with the browser's native
# right-click menu and can crash the ttyd session.
unbind-key -n MouseDown3Pane
